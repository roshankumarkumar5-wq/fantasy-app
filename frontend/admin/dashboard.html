<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="../css/style.css?v=1785291241">
  </head>
<body class="themed">
  <div class="topbar">
    <h1>Admin Panel</h1>
    <button id="logoutBtn">Log Out</button>
  </div>
  <div class="container">
    <div class="tab-nav" id="adminTabs">
      <a href="#" class="active" data-tab="matches">Matches</a>
      <a href="teams-players.html">Teams &amp; Players</a>
      <a href="approvals.html">Approvals</a>
      <a href="users.html">Users</a>
      <a href="#" data-tab="leaderboard">Leaderboard</a>
      <a href="#" data-tab="audit">Audit Log</a>
    </div>

    <div id="createMatchCard" class="card">
      <h3>Create New Match</h3>
      <a href="create-match.html"><button class="btn">+ Schedule a Match</button></a>
    </div>

    <div class="tab-nav" id="matchStatusTabs">
      <a href="#" class="active" data-ftab="upcoming">Upcoming</a>
      <a href="#" data-ftab="completed">Completed</a>
    </div>

    <div id="matchList"><div class="card"><p>Loading matches...</p></div></div>
  </div>

  <script>window.API_BASE_URL = 'https://fantasy-app-backend-znyu.onrender.com/api';</script>
  <script src="../js/api.js?v=1785291241"></script>
  <script>
    requireAdminLogin();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      Api.logAction('logout').catch(() => {});
      Auth.clearSession();
      window.location.href = '../login.html';
    });

    let overallData = [];
    let viewedTeams = {};
    let currentFilterTab = 'upcoming';
    let allMatches = [];

    function teamLogo(team) {
      if (team?.logo_url) {
        return `<img src="${team.logo_url}" class="promo-team-logo" alt="${team.short_code || team.name}">`;
      }
      return `<div class="promo-team-logo-fallback">${(team?.short_code || '?').slice(0, 3)}</div>`;
    }

    async function loadMatches() {
      const container = document.getElementById('matchList');
      document.getElementById('createMatchCard').style.display = 'block';
      document.getElementById('matchStatusTabs').style.display = 'flex';
      try {
        allMatches = await Api.getMatches();
        const filtered = allMatches.filter(m => currentFilterTab === 'completed' ? m.status === 'completed' : m.status !== 'completed');
        if (filtered.length === 0) {
          container.innerHTML = `<div class="card"><p>No ${currentFilterTab} matches.</p></div>`;
          return;
        }
        container.innerHTML = filtered.map(m => `
          <div class="promo-card" data-match-id="${m.id}">
            ${m.match_format ? `<div class="promo-format-tag">${m.match_format}</div>` : ''}
            <div class="promo-teams">
              <div class="promo-team">
                ${teamLogo(m.team_a)}
                <span class="promo-team-name">${m.team_a?.name || m.team_a?.short_code || '?'}</span>
              </div>
              <span class="promo-vs">VS</span>
              <div class="promo-team">
                ${teamLogo(m.team_b)}
                <span class="promo-team-name">${m.team_b?.name || m.team_b?.short_code || '?'}</span>
              </div>
            </div>
            <div class="promo-info-row">
              <div class="promo-info-box">
                <span class="promo-info-label">Date &amp; Time</span>
                <span class="promo-info-value">${formatIST(m.match_date)}</span>
              </div>
              ${m.venue ? `
              <div class="promo-info-box">
                <span class="promo-info-label">Venue</span>
                <span class="promo-info-value">${m.venue}</span>
              </div>` : ''}
            </div>
            <div class="promo-status-badge promo-status-${m.status}">${m.status}${m.status === 'upcoming' ? `<br><span style="font-size:10px;">Deadline: ${formatIST(m.selection_deadline)}</span>` : ''}</div>
          </div>
        `).join('');

        document.querySelectorAll('.promo-card').forEach(card => {
          card.addEventListener('click', () => {
            window.location.href = `match-detail.html?matchId=${card.dataset.matchId}`;
          });
        });
      } catch (err) {
        container.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    // ---- Overall Leaderboard with drill-down ----
    async function renderOverallLeaderboard(container) {
      document.getElementById('createMatchCard').style.display = 'none';
      if (overallData.length === 0) {
        try {
          overallData = await Api.getOverallLeaderboard();
        } catch (err) {
          container.innerHTML = `<div class="card"><p class="error-msg">${err.message}</p></div>`;
          return;
        }
      }

      if (overallData.length === 0) {
        container.innerHTML = '<div class="card"><p>No completed matches yet.</p></div>';
        return;
      }

      container.innerHTML = `
        <div class="card">
          <h3>Overall Leaderboard</h3>
          <p class="match-meta">Total points across all completed matches. Click a user to drill down.</p>
        </div>
        <div id="overallList">${overallData.map((u, i) => `
          <div class="card" style="cursor:pointer;">
            <div class="user-header" data-idx="${i}" style="display:flex; justify-content:space-between; align-items:center;">
              <span><strong>${i + 1}.</strong> ${u.full_name}</span>
              <span style="font-weight:700; color:var(--primary);">${u.total_points}</span>
            </div>
            <div class="user-matches" id="adminUserMatches-${i}" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);"></div>
          </div>
        `).join('')}</div>
      `;

      document.querySelectorAll('.user-header').forEach(hdr => {
        hdr.addEventListener('click', () => {
          const idx = hdr.dataset.idx;
          const panel = document.getElementById(`adminUserMatches-${idx}`);
          if (panel.style.display === 'none') {
            renderUserMatches(idx, panel);
          }
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
      });
    }

    function renderUserMatches(idx, panel) {
      const user = overallData[idx];
      panel.innerHTML = user.matches.map((m, mi) => `
        <div class="match-row" data-mi="${mi}" data-uidx="${idx}" style="display:flex; justify-content:space-between; align-items:center; padding:6px 0 6px 16px; cursor:pointer; border-bottom:1px solid var(--border);">
          <span style="font-size:13px;">${m.match_label} <span class="match-meta">(${formatIST(m.match_date)})</span></span>
          <span style="font-weight:600; font-size:13px;">${m.points}</span>
        </div>
        <div class="match-team" id="adminMatchTeam-${idx}-${mi}" style="display:none; padding:8px 0 8px 32px;"></div>
      `).join('');

      panel.querySelectorAll('.match-row').forEach(row => {
        row.addEventListener('click', () => {
          const mi = row.dataset.mi;
          const ui = row.dataset.uidx;
          const teamPanel = document.getElementById(`adminMatchTeam-${ui}-${mi}`);
          if (teamPanel.style.display === 'none') {
            renderMatchTeam(ui, mi, teamPanel);
          }
          teamPanel.style.display = teamPanel.style.display === 'none' ? 'block' : 'none';
        });
      });
    }

    async function renderMatchTeam(uIdx, mIdx, panel) {
      const user = overallData[uIdx];
      const match = user.matches[mIdx];
      const cacheKey = `${user.user_id}-${match.match_id}`;

      if (viewedTeams[cacheKey]) {
        renderTeamPlayers(viewedTeams[cacheKey], panel);
        return;
      }

      panel.innerHTML = '<p class="match-meta">Loading...</p>';
      try {
        const { team } = await Api.getUserTeam(match.match_id, user.user_id);
        if (!team) {
          panel.innerHTML = '<p class="match-meta">No team submitted.</p>';
          return;
        }
        viewedTeams[cacheKey] = team;
        renderTeamPlayers(team, panel);
      } catch (err) {
        panel.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    function renderTeamPlayers(team, panel) {
      panel.innerHTML = `
        <div style="font-size:12px; font-weight:600; margin-bottom:6px;">Total: ${team.total_points ?? 0} pts</div>
        ${team.players.map(tp => `
          <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
            <span>${tp.player.name}${tp.special_rank ? ` <span class="special-chip">S${tp.special_rank}</span>` : ''}</span>
            <span style="font-weight:600;">${tp.points === null ? '—' : tp.points}</span>
          </div>
        `).join('')}
      `;
    }

    async function renderAuditLog(container) {
      try {
        const logs = await Api.getAuditLogs(500, 0);
        if (!logs || logs.length === 0) {
          container.innerHTML = '<div class="card"><p>No audit log entries yet.</p></div>';
          return;
        }
        container.innerHTML = `
          <div class="card" style="padding:0; overflow-x:auto;">
            <table class="admin-table" style="width:100%; border-collapse:collapse;">
              <colgroup>
                <col style="width:170px;">
                <col style="width:160px;">
                <col style="width:100px;">
                <col>
              </colgroup>
              <thead>
                <tr>
                  <th>Timestamp (IST)</th>
                  <th>User</th>
                  <th>Action</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody>
                ${logs.map(log => `
                  <tr>
                    <td style="white-space:nowrap; font-size:12px;">${formatIST(log.created_at)}</td>
                    <td style="word-break:break-word;">${escHtml(log.user_name)}</td>
                    <td>${escHtml(log.action)}</td>
                    <td style="word-break:break-word;">${escHtml(log.details || '')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p class="error-msg">${err.message}</p></div>`;
      }
    }

    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Match status filter tabs (Upcoming / Completed)
    document.querySelectorAll('#matchStatusTabs a[data-ftab]').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('#matchStatusTabs a[data-ftab]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilterTab = tab.dataset.ftab;
        loadMatches();
      });
    });

    // Admin section tabs (Matches / Leaderboard)
    document.querySelectorAll('#adminTabs a[data-tab]').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('#adminTabs a[data-tab]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tabName = tab.dataset.tab;
        const container = document.getElementById('matchList');
        if (tabName === 'leaderboard') {
          document.getElementById('matchStatusTabs').style.display = 'none';
          document.getElementById('createMatchCard').style.display = 'none';
          renderOverallLeaderboard(container);
        } else if (tabName === 'audit') {
          document.getElementById('matchStatusTabs').style.display = 'none';
          document.getElementById('createMatchCard').style.display = 'none';
          renderAuditLog(container);
        } else {
          document.getElementById('matchStatusTabs').style.display = 'flex';
          document.getElementById('createMatchCard').style.display = 'block';
          loadMatches();
        }
      });
    });

    loadMatches();
  </script>
</body>
</html>
