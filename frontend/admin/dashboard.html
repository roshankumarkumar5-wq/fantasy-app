<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="../css/style.css?v=1785292223">
  </head>
<body class="themed">
  <div class="topbar">
    <h1>Admin Panel</h1>
    <button id="logoutBtn">Log Out</button>
  </div>
  <div class="container">
    <div class="tab-nav" id="adminTabs">
      <a href="#" class="active" data-tab="matches">Matches</a>
      <a href="teams-players.html">Teams &amp; Players</a>
      <a href="approvals.html">Approvals</a>
      <a href="users.html">Users</a>
      <a href="#" data-tab="leaderboard">Leaderboard</a>
      <a href="#" data-tab="players">Players</a>
      <a href="#" data-tab="audit">Audit Log</a>
      <a href="#" data-tab="settings">Settings</a>
      <a href="#" data-tab="backup">Backup &amp; Restore</a>
    </div>

    <div id="createMatchCard" class="card">
      <h3>Create New Match</h3>
      <a href="create-match.html"><button class="btn">+ Schedule a Match</button></a>
    </div>

    <div class="tab-nav" id="matchStatusTabs">
      <a href="#" class="active" data-ftab="upcoming">Upcoming</a>
      <a href="#" data-ftab="completed">Completed</a>
    </div>

    <div id="matchList"><div class="card"><p>Loading matches...</p></div></div>
  </div>

  <script>window.API_BASE_URL = 'https://fantasy-app-backend-znyu.onrender.com/api';</script>
  <script src="../js/api.js?v=1800000001"></script>
  <script src="../js/player-leaderboard.js?v=1"></script>
  <script>
    requireAdminLogin();

    document.getElementById('logoutBtn').addEventListener('click', () => {
      Api.logAction('logout').catch(() => {});
      Auth.clearSession();
      window.location.href = '../login.html';
    });

    let overallData = [];
    let viewedTeams = {};
    let currentFilterTab = 'upcoming';
    let allMatches = [];

    function teamLogo(team) {
      if (team?.logo_url) {
        return `<img src="${team.logo_url}" class="promo-team-logo" alt="${team.short_code || team.name}">`;
      }
      return `<div class="promo-team-logo-fallback">${(team?.short_code || '?').slice(0, 3)}</div>`;
    }

    async function loadMatches() {
      const container = document.getElementById('matchList');
      document.getElementById('createMatchCard').style.display = 'block';
      document.getElementById('matchStatusTabs').style.display = 'flex';
      try {
        allMatches = await Api.getMatches();
        const filtered = allMatches.filter(m => currentFilterTab === 'completed' ? m.status === 'completed' : m.status !== 'completed');
        if (filtered.length === 0) {
          container.innerHTML = `<div class="card"><p>No ${currentFilterTab} matches.</p></div>`;
          return;
        }
        container.innerHTML = filtered.map(m => `
          <div class="promo-card" data-match-id="${m.id}">
            ${m.match_format ? `<div class="promo-format-tag">${m.match_format}</div>` : ''}
            <div class="promo-teams">
              <div class="promo-team">
                ${teamLogo(m.team_a)}
                <span class="promo-team-name">${m.team_a?.name || m.team_a?.short_code || '?'}</span>
              </div>
              <span class="promo-vs">VS</span>
              <div class="promo-team">
                ${teamLogo(m.team_b)}
                <span class="promo-team-name">${m.team_b?.name || m.team_b?.short_code || '?'}</span>
              </div>
            </div>
            <div class="promo-info-row">
              <div class="promo-info-box">
                <span class="promo-info-label">Date &amp; Time</span>
                <span class="promo-info-value">${formatIST(m.match_date)}</span>
              </div>
              ${m.venue ? `
              <div class="promo-info-box">
                <span class="promo-info-label">Venue</span>
                <span class="promo-info-value">${m.venue}</span>
              </div>` : ''}
            </div>
            <div class="promo-status-badge promo-status-${m.status}">${m.status}${m.status === 'upcoming' ? `<br><span style="font-size:10px;">Deadline: ${formatIST(m.selection_deadline)}</span>` : ''}</div>
          </div>
        `).join('');

        document.querySelectorAll('.promo-card').forEach(card => {
          card.addEventListener('click', () => {
            window.location.href = `match-detail.html?matchId=${card.dataset.matchId}`;
          });
        });
      } catch (err) {
        container.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    // ---- Overall Leaderboard with drill-down ----
    async function renderOverallLeaderboard(container) {
      document.getElementById('createMatchCard').style.display = 'none';
      if (overallData.length === 0) {
        try {
          overallData = await Api.getOverallLeaderboard();
        } catch (err) {
          container.innerHTML = `<div class="card"><p class="error-msg">${err.message}</p></div>`;
          return;
        }
      }

      if (overallData.length === 0) {
        container.innerHTML = '<div class="card"><p>No completed matches yet.</p></div>';
        return;
      }

      container.innerHTML = `
        <div class="card">
          <h3>Overall Leaderboard</h3>
          <p class="match-meta">Total points across all completed matches. Click a user to drill down.</p>
        </div>
        <div id="overallList">${overallData.map((u, i) => `
          <div class="card" style="cursor:pointer;">
            <div class="user-header" data-idx="${i}" style="display:flex; justify-content:space-between; align-items:center;">
              <span><strong>${i + 1}.</strong> ${u.full_name}</span>
              <span style="font-weight:700; color:var(--primary);">${u.total_points}</span>
            </div>
            <div class="user-matches" id="adminUserMatches-${i}" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);"></div>
          </div>
        `).join('')}</div>
      `;

      document.querySelectorAll('.user-header').forEach(hdr => {
        hdr.addEventListener('click', () => {
          const idx = hdr.dataset.idx;
          const panel = document.getElementById(`adminUserMatches-${idx}`);
          if (panel.style.display === 'none') {
            renderUserMatches(idx, panel);
          }
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
      });
    }

    function renderUserMatches(idx, panel) {
      const user = overallData[idx];
      panel.innerHTML = user.matches.map((m, mi) => `
        <div class="match-row" data-mi="${mi}" data-uidx="${idx}" style="display:flex; justify-content:space-between; align-items:center; padding:6px 0 6px 16px; cursor:pointer; border-bottom:1px solid var(--border);">
          <span style="font-size:13px;">${m.match_label} <span class="match-meta">(${formatIST(m.match_date)})</span></span>
          <span style="font-weight:600; font-size:13px;">${m.points}</span>
        </div>
        <div class="match-team" id="adminMatchTeam-${idx}-${mi}" style="display:none; padding:8px 0 8px 32px;"></div>
      `).join('');

      panel.querySelectorAll('.match-row').forEach(row => {
        row.addEventListener('click', () => {
          const mi = row.dataset.mi;
          const ui = row.dataset.uidx;
          const teamPanel = document.getElementById(`adminMatchTeam-${ui}-${mi}`);
          if (teamPanel.style.display === 'none') {
            renderMatchTeam(ui, mi, teamPanel);
          }
          teamPanel.style.display = teamPanel.style.display === 'none' ? 'block' : 'none';
        });
      });
    }

    async function renderMatchTeam(uIdx, mIdx, panel) {
      const user = overallData[uIdx];
      const match = user.matches[mIdx];
      const cacheKey = `${user.user_id}-${match.match_id}`;

      if (viewedTeams[cacheKey]) {
        renderTeamPlayers(viewedTeams[cacheKey], panel);
        return;
      }

      panel.innerHTML = '<p class="match-meta">Loading...</p>';
      try {
        const { team } = await Api.getUserTeam(match.match_id, user.user_id);
        if (!team) {
          panel.innerHTML = '<p class="match-meta">No team submitted.</p>';
          return;
        }
        viewedTeams[cacheKey] = team;
        renderTeamPlayers(team, panel);
      } catch (err) {
        panel.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    function renderTeamPlayers(team, panel) {
      panel.innerHTML = `
        <div style="font-size:12px; font-weight:600; margin-bottom:6px;">Total: ${team.total_points ?? 0} pts</div>
        ${team.players.map(tp => `
          <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
            <span>${tp.player.name}${tp.special_rank ? ` <span class="special-chip">S${tp.special_rank}</span>` : ''}</span>
            <span style="font-weight:600;">${tp.points === null ? '—' : tp.points}</span>
          </div>
        `).join('')}
      `;
    }

    async function renderAuditLog(container) {
      try {
        const logs = await Api.getAuditLogs(500, 0);
        if (!logs || logs.length === 0) {
          container.innerHTML = '<div class="card"><p>No audit log entries yet.</p></div>';
          return;
        }
        container.innerHTML = `
          <div class="card" style="padding:0; overflow-x:auto;">
            <table class="admin-table" style="width:100%; border-collapse:collapse; table-layout:auto;">
              <colgroup>
                <col style="min-width:95px;">
                <col style="min-width:120px;">
                <col style="min-width:70px;">
                <col style="min-width:100px;">
              </colgroup>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>User</th>
                  <th>Action</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody>
                ${logs.map(log => {
                  const ts = new Date(log.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
                  const parts = ts.split(', ');
                  return `
                  <tr>
                    <td style="font-size:12px; line-height:1.4;">${parts[0]}<br>${parts[1] || ''}</td>
                    <td style="word-break:break-word;">${escHtml(log.user_name)}</td>
                    <td>${escHtml(log.action)}</td>
                    <td style="word-break:break-word;">${escHtml(log.details || '')}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="card"><p class="error-msg">${err.message}</p></div>`;
      }
    }

    async function renderSettings(container) {
      document.getElementById('matchStatusTabs').style.display = 'none';
      document.getElementById('createMatchCard').style.display = 'none';

      let settings = { enable_player_leaderboard: true };
      try {
        settings = await Api.getAdminSettings();
      } catch (err) {
        container.innerHTML = `<div class="card"><p class="error-msg">${err.message}</p></div>`;
        return;
      }

      container.innerHTML = `
        <div class="card">
          <h3>Settings</h3>
          <label style="display:flex; align-items:center; gap:10px; margin:14px 0 6px; font-weight:600; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="enablePlayerLb" style="width:auto;" ${settings.enable_player_leaderboard ? 'checked' : ''}>
            Show "Players" leaderboard tab to users
          </label>
          <p class="match-meta" style="margin:6px 0 0; padding-left:24px;">Ranks players across both teams by total points accumulated across all completed matches. Users see the tab only while this is on — you can toggle it anytime and the change is immediate.</p>
          <button class="btn" id="saveSettingsBtn">Save Settings</button>
          <div id="settingsMsg"></div>
        </div>
      `;

      document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
        const enabled = document.getElementById('enablePlayerLb').checked;
        const msg = document.getElementById('settingsMsg');
        try {
          await Api.updateAdminSettings({ enable_player_leaderboard: enabled });
          msg.innerHTML = '<p class="success-msg">Settings saved. Users will ' + (enabled ? 'now see' : 'no longer see') + ' the Players tab.</p>';
        } catch (err) {
          msg.innerHTML = `<p class="error-msg">${err.message}</p>`;
        }
      });
    }

    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ---- Players Leaderboard (shared renderer from ../js/player-leaderboard.js) ----
    function renderAdminPlayersLeaderboard(container) {
      document.getElementById('matchStatusTabs').style.display = 'none';
      document.getElementById('createMatchCard').style.display = 'none';
      PlayerLeaderboard.render(container);
    }

    function renderBackup(container) {
      document.getElementById('matchStatusTabs').style.display = 'none';
      document.getElementById('createMatchCard').style.display = 'none';

      container.innerHTML = `
        <div class="card">
          <h3>Backup &amp; Restore</h3>
          <p class="match-meta">Keep a safe, offline copy of every row in every table (teams, players, matches, user teams, stats, users, settings). If the database is ever lost, breached, or corrupted, use the Restore section below to bring it back to this backup's point in time. This operation is admin-only.</p>
        </div>

        <div class="card">
          <h3>Download Backup</h3>
          <p class="match-meta">Downloads a full snapshot of all app data as a single JSON file. Keep it somewhere safe (e.g. Google Drive, a private GitHub repo, an external drive). Take a fresh backup before making big changes.</p>
          <button class="btn" id="downloadBackupBtn">Download Full Backup</button>
          <div id="backupMsg" style="margin-top:10px;"></div>
        </div>

        <div class="card" style="border:1px solid #e5484d;">
          <h3 style="color:#e5484d;">Restore From Backup</h3>
          <p class="match-meta" style="color:#e5484d;">DANGER: Restoring REPLACES all current data with the backup's contents. Anything added to the app after the backup was taken will be permanently deleted. This cannot be undone.</p>
          <input type="file" id="backupFileInput" accept=".json,application/json" style="max-width:100%;">
          <label style="display:flex; align-items:flex-start; gap:8px; margin:12px 0; font-size:13px; cursor:pointer;">
            <input type="checkbox" id="restoreConfirm" style="width:auto; margin-top:2px;">
            I understand this will permanently overwrite all current app data.
          </label>
          <button class="btn" id="restoreBackupBtn" disabled>Restore Backup</button>
          <div id="restoreMsg" style="margin-top:10px;"></div>
        </div>
      `;

      const backupMsg = document.getElementById('backupMsg');
      const restoreMsg = document.getElementById('restoreMsg');

      document.getElementById('downloadBackupBtn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        backupMsg.innerHTML = '<p class="match-meta">Preparing backup...</p>';
        try {
          const data = await Api.downloadBackup();
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `fantasy-backup-${(data.exported_at || new Date().toISOString()).slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          backupMsg.innerHTML = '<p class="success-msg">Backup downloaded. Store this file somewhere safe.</p>';
        } catch (err) {
          backupMsg.innerHTML = `<p class="error-msg">${escHtml(err.message)}</p>`;
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('restoreConfirm').addEventListener('change', (e) => {
        document.getElementById('restoreBackupBtn').disabled = !e.currentTarget.checked;
      });

      document.getElementById('restoreBackupBtn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const fileInput = document.getElementById('backupFileInput');
        if (!fileInput.files || !fileInput.files[0]) {
          restoreMsg.innerHTML = '<p class="error-msg">Choose a backup JSON file first.</p>';
          return;
        }
        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        btn.disabled = true;
        restoreMsg.innerHTML = '<p class="match-meta">Restoring... do not close this page.</p>';
        try {
          const res = await Api.restoreBackup(fd);
          const summary = res.restored
            ? Object.entries(res.restored).map(([t, n]) => `${t}: ${n}`).join(', ')
            : '';
          restoreMsg.innerHTML = `<p class="success-msg">${escHtml(res.message || 'Restore completed.')}${summary ? '<br><span style="font-size:12px;">' + escHtml(summary) + '</span>' : ''}</p>`;
        } catch (err) {
          restoreMsg.innerHTML = `<p class="error-msg">${escHtml(err.message)}</p>`;
        } finally {
          document.getElementById('restoreConfirm').checked = false;
          document.getElementById('restoreBackupBtn').disabled = true;
          fileInput.value = '';
        }
      });
    }

    // Match status filter tabs (Upcoming / Completed)
    document.querySelectorAll('#matchStatusTabs a[data-ftab]').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('#matchStatusTabs a[data-ftab]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilterTab = tab.dataset.ftab;
        loadMatches();
      });
    });

    // Admin section tabs (Matches / Leaderboard)
    document.querySelectorAll('#adminTabs a[data-tab]').forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('#adminTabs a[data-tab]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tabName = tab.dataset.tab;
        const container = document.getElementById('matchList');
        if (tabName === 'leaderboard') {
          document.getElementById('matchStatusTabs').style.display = 'none';
          document.getElementById('createMatchCard').style.display = 'none';
          renderOverallLeaderboard(container);
        } else if (tabName === 'players') {
          renderAdminPlayersLeaderboard(container);
        } else if (tabName === 'audit') {
          document.getElementById('matchStatusTabs').style.display = 'none';
          document.getElementById('createMatchCard').style.display = 'none';
          renderAuditLog(container);
        } else if (tabName === 'settings') {
          renderSettings(container);
        } else if (tabName === 'backup') {
          renderBackup(container);
        } else {
          document.getElementById('matchStatusTabs').style.display = 'flex';
          document.getElementById('createMatchCard').style.display = 'block';
          loadMatches();
        }
      });
    });

    loadMatches();
  </script>
</body>
</html>
