<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Change Password - Fantasy App</title>
<link rel="stylesheet" href="css/style.css?v=1785288504">
  </head>
<body class="themed">
  <div class="topbar">
    <h1>Change Password</h1>
    <button id="backBtn">Back</button>
  </div>
  <div class="container">
    <div class="card" id="formCard">
      <h3>Set a new password</h3>
      <p class="match-meta">If an admin gave you a temporary password, use this page to change it to something you'll remember.</p>

      <label>Current password</label>
      <input type="password" id="currentPassword" placeholder="Enter your current or temporary password">

      <label>New password (min 6 characters)</label>
      <input type="password" id="newPassword" placeholder="Enter a new password">

      <label>Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter the new password">

      <button class="btn" id="changeBtn" style="margin-top:8px;">Update Password</button>
      <div id="msg"></div>
    </div>

    <div class="card" id="successCard" style="display:none;">
      <h3 style="color:var(--success);">Password updated ✓</h3>
      <p>Your password has been changed. Use your new password the next time you log in.</p>
      <button class="btn" id="goBackBtn">Back to Matches</button>
    </div>
  </div>

  <script>window.API_BASE_URL = 'https://fantasy-app-backend-znyu.onrender.com/api';</script>
  <script src="js/api.js?v=1785288504"></script>
  <script>
    requireLogin();

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'matches.html';
    });
    document.getElementById('goBackBtn').addEventListener('click', () => {
      window.location.href = 'matches.html';
    });

    document.getElementById('changeBtn').addEventListener('click', async () => {
      const current = document.getElementById('currentPassword').value;
      const newPw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('msg');

      if (!current || !newPw || !confirm) {
        msg.innerHTML = '<p class="error-msg">All fields are required.</p>';
        return;
      }
      if (newPw.length < 6) {
        msg.innerHTML = '<p class="error-msg">New password must be at least 6 characters.</p>';
        return;
      }
      if (newPw !== confirm) {
        msg.innerHTML = '<p class="error-msg">New passwords do not match.</p>';
        return;
      }

      const btn = document.getElementById('changeBtn');
      btn.disabled = true;
      btn.textContent = 'Updating...';
      try {
        await Api.changePassword({ current_password: current, new_password: newPw });
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
      } catch (err) {
        msg.innerHTML = `<p class="error-msg">${err.message}</p>`;
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
