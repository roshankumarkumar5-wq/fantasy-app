<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Results - Fantasy App</title>
<link rel="stylesheet" href="css/style.css?v=1785288629">
  </head>
<body class="themed">
  <div class="topbar">
    <h1>Match Results</h1>
    <button onclick="window.location.href='matches.html'">Back</button>
  </div>
  <div class="container">
    <div class="card" id="myTeamCard"><p>Loading your team...</p></div>
    <div class="card">
      <h3>Leaderboard</h3>
      <div id="leaderboard"><p>Loading...</p></div>
    </div>
  </div>

  <script>window.API_BASE_URL = 'https://fantasy-app-backend-znyu.onrender.com/api';</script>
  <script src="js/api.js?v=1785288629"></script>
  <script>
    requireLogin();
    const params = new URLSearchParams(window.location.search);
    const matchId = params.get('matchId');
    if (!matchId) window.location.href = 'matches.html';

    async function loadMyTeam() {
      const el = document.getElementById('myTeamCard');
      try {
        const { team } = await Api.getMyTeam(matchId);
        if (!team) {
          el.innerHTML = '<p>You did not submit a team for this match.</p>';
          return;
        }
        el.innerHTML = `
          <h3>Your Team - ${team.total_points ?? 0} points</h3>
          ${team.players.map((tp, i) => `
            <div class="player-row" data-idx="${i}" style="cursor:pointer; flex-direction:column; align-items:stretch;">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div class="player-info">
                  <span class="player-name">${tp.player.name} ${tp.special_rank ? `<span class="special-chip">S${tp.special_rank}</span>` : ''}</span>
                  <span class="player-meta">${tp.player.role}${tp.points !== null ? ' · tap for breakdown' : ''}</span>
                </div>
                <span style="font-weight:700; color:var(--primary);">${tp.points === null ? '—' : tp.points}</span>
              </div>
              <div class="breakdown-panel" id="breakdown-${i}" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
                ${tp.breakdown && tp.breakdown.length > 0 ? `
                  ${tp.breakdown.map(line => `
                    <div style="display:flex; justify-content:space-between; font-size:13px; padding:3px 0;">
                      <span style="color:var(--muted);">${line.label}</span>
                      <span style="font-weight:600; color:${line.points < 0 ? 'var(--danger)' : 'var(--text)'};">${line.points > 0 ? '+' : ''}${line.points}</span>
                    </div>
                  `).join('')}
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0 0; margin-top:4px; border-top:1px dashed var(--border);">
                    <span style="font-weight:600;">Base points</span>
                    <span style="font-weight:700;">${tp.base_points}</span>
                  </div>
                  ${tp.special_rank ? `
                    <div style="display:flex; justify-content:space-between; font-size:13px; padding:3px 0;">
                      <span style="color:var(--muted);">Special player ×${tp.multiplier}</span>
                      <span style="font-weight:600;">${tp.points}</span>
                    </div>
                  ` : ''}
                ` : '<p class="match-meta">No stats entered for this player yet.</p>'}
              </div>
            </div>
          `).join('')}
        `;

        document.querySelectorAll('.player-row[data-idx]').forEach(row => {
          row.addEventListener('click', () => {
            const panel = document.getElementById(`breakdown-${row.dataset.idx}`);
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
          });
        });
      } catch (err) {
        el.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    let viewedTeams = {};

    async function showOtherTeam(userId, userName) {
      const panel = document.getElementById('otherTeamPanel');
      if (viewedTeams[userId] && panel.dataset.userId === userId) {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        return;
      }
      panel.innerHTML = `<p class="match-meta">Loading ${userName}'s team...</p>`;
      panel.style.display = 'block';
      panel.dataset.userId = userId;
      try {
        const { team } = await Api.getUserTeam(matchId, userId);
        if (!team) {
          panel.innerHTML = `<p class="match-meta">${userName} did not submit a team.</p>`;
          return;
        }
        viewedTeams[userId] = team;
        panel.innerHTML = `
          <h4>${userName} — ${team.total_points ?? 0} pts</h4>
          ${team.players.map((tp, i) => `
            <div class="player-row" style="flex-direction:column; align-items:stretch;">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div class="player-info">
                  <span class="player-name">${tp.player.name} ${tp.special_rank ? `<span class="special-chip">S${tp.special_rank}</span>` : ''}</span>
                  <span class="player-meta">${tp.player.role}</span>
                </div>
                <span style="font-weight:700; color:var(--primary);">${tp.points === null ? '—' : tp.points}</span>
              </div>
              ${tp.breakdown && tp.breakdown.length > 0 ? `
                <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
                  ${tp.breakdown.map(line => `
                    <div style="display:flex; justify-content:space-between; font-size:13px; padding:3px 0;">
                      <span style="color:var(--muted);">${line.label}</span>
                      <span style="font-weight:600; color:${line.points < 0 ? 'var(--danger)' : 'var(--text)'};">${line.points > 0 ? '+' : ''}${line.points}</span>
                    </div>
                  `).join('')}
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0 0; margin-top:4px; border-top:1px dashed var(--border);">
                    <span style="font-weight:600;">Base points</span>
                    <span style="font-weight:700;">${tp.base_points}</span>
                  </div>
                  ${tp.special_rank ? `
                    <div style="display:flex; justify-content:space-between; font-size:13px; padding:3px 0;">
                      <span style="color:var(--muted);">Special player ×${tp.multiplier}</span>
                      <span style="font-weight:600;">${tp.points}</span>
                    </div>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          `).join('')}
        `;
      } catch (err) {
        panel.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    async function loadLeaderboard() {
      const el = document.getElementById('leaderboard');
      try {
        const rows = await Api.getPublicLeaderboard(matchId);
        if (rows.length === 0) {
          el.innerHTML = '<p class="match-meta">No teams submitted yet.</p>';
          return;
        }
        const hasUserId = rows.some(r => r.user_id);
        el.innerHTML = `
          <table class="admin-table">
            <tr><th>#</th><th>Name</th><th>Points</th></tr>
            ${rows.map(r => `
              <tr style="${r.is_you ? 'background:#e0edff;font-weight:600;' : ''}">
                <td>${r.rank}</td>
                <td>${r.is_you ? r.full_name + ' (You)' : hasUserId ? `<a href="#" class="view-team-link" data-user-id="${r.user_id}" data-user-name="${r.full_name}" style="color:var(--primary);font-weight:600;text-decoration:none;">${r.full_name}</a>` : r.full_name}</td>
                <td>${r.total_points}</td>
              </tr>
            `).join('')}
          </table>
          <div id="otherTeamPanel" style="display:none; margin-top:12px;"></div>
        `;

        document.querySelectorAll('.view-team-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            showOtherTeam(link.dataset.userId, link.dataset.userName);
          });
        });
      } catch (err) {
        el.innerHTML = `<p class="error-msg">${err.message}</p>`;
      }
    }

    loadMyTeam();
    loadLeaderboard();
  </script>
</body>
</html>
